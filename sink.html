<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root { --red:#a3121b; --bone:#d9d2bf; --dim:#7b7468; --ink:#050505; }
  html, body { margin:0; width:100%; height:100%; background:#000; overflow:hidden; overscroll-behavior:none;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; touch-action:none; }
  body { color:var(--bone); font-family:'Special Elite','Courier New',monospace; }
  .f-elite { font-family:'Special Elite','Courier New',monospace; }
  .f-vt { font-family:'VT323','Courier New',monospace; letter-spacing:.04em; }
  #app { position:fixed; inset:0; }
  #app canvas { display:block; width:100%; height:100%; }
  .layer { position:fixed; inset:0; }
  .hidden-x { display:none !important; }

  /* ---------- utility fallbacks (identical to Tailwind; keeps layout intact if the CDN is unreachable) ---------- */
  .absolute{position:absolute}.relative{position:relative}.flex{display:flex}.items-start{align-items:flex-start}
  .justify-between{justify-content:space-between}.justify-center{justify-content:center}.text-center{text-align:center}
  .left-0{left:0}.right-0{right:0}.bottom-4{bottom:1rem}.select-none{user-select:none;-webkit-user-select:none}
  .leading-tight{line-height:1.25}.leading-relaxed{line-height:1.625}
  .mt-2{margin-top:.5rem}.mt-3{margin-top:.75rem}.mt-4{margin-top:1rem}.mt-6{margin-top:1.5rem}.mt-8{margin-top:2rem}.mt-10{margin-top:2.5rem}.mt-12{margin-top:3rem}
  .pt-24{padding-top:6rem}.px-4{padding-left:1rem;padding-right:1rem}.px-6{padding-left:1.5rem;padding-right:1.5rem}
  .opacity-35{opacity:.35}.opacity-50{opacity:.5}.opacity-55{opacity:.55}.opacity-60{opacity:.6}.opacity-70{opacity:.7}.opacity-75{opacity:.75}.opacity-80{opacity:.8}
  .text-\[13px\]{font-size:13px}.text-\[14px\]{font-size:14px}.text-\[15px\]{font-size:15px}.text-\[16px\]{font-size:16px}.text-\[17px\]{font-size:17px}
  .text-\[18px\]{font-size:18px}.text-\[20px\]{font-size:20px}.text-\[22px\]{font-size:22px}.text-\[44px\]{font-size:44px}
  .tracking-\[\.3em\]{letter-spacing:.3em}.tracking-\[\.4em\]{letter-spacing:.4em}.max-w-\[640px\]{max-width:640px}
  .hidden-x{display:none!important}
  .vhs { text-shadow:1.5px 0 rgba(255,20,50,.55), -1.5px 0 rgba(20,200,255,.4), 0 0 6px rgba(255,255,255,.15); }

  /* ---------- loader ---------- */
  #loader { z-index:50; background:#000; display:flex; align-items:center; justify-content:center; flex-direction:column; }
  #loader::before { content:""; position:absolute; inset:-50%; opacity:.07; pointer-events:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain .5s steps(6) infinite; }
  @keyframes grain { 0%{transform:translate(0,0)} 20%{transform:translate(-3%,2%)} 40%{transform:translate(2%,-4%)} 60%{transform:translate(-4%,-1%)} 80%{transform:translate(3%,3%)} 100%{transform:translate(0,0)} }
  .title { position:relative; font-size:clamp(64px,16vw,168px); letter-spacing:.32em; padding-left:.32em; line-height:1; color:#cfc6b0;
    text-shadow:3px 0 rgba(170,10,20,.75), -3px 0 rgba(10,150,190,.35), 0 0 30px rgba(120,0,0,.35); animation:titleJitter 4s infinite; }
  @keyframes titleJitter { 0%,92%,100%{transform:translate(0,0); filter:none} 93%{transform:translate(-4px,1px); filter:blur(.6px)} 95%{transform:translate(5px,-1px)} 97%{transform:translate(-2px,0); filter:blur(1px)} }
  .drip { position:absolute; top:78%; width:5px; border-radius:0 0 4px 4px; background:linear-gradient(#5b0c10,#2a0306); animation:drip 5.5s infinite ease-in; opacity:.9; }
  .drip::after { content:""; position:absolute; bottom:-6px; left:-2px; width:9px; height:9px; border-radius:50%; background:#3a0508; }
  @keyframes drip { 0%{height:0; opacity:0} 10%{opacity:.9} 70%{height:46px} 85%{height:52px; opacity:.9} 100%{height:56px; opacity:0} }
  .bar-wrap { width:min(420px,78vw); height:3px; background:#181614; overflow:hidden; position:relative; }
  #load-bar { height:100%; width:0%; background:linear-gradient(90deg,#4b0a0e,#a3121b); transition:width .35s ease-out; box-shadow:0 0 10px rgba(163,18,27,.8); }
  #btn-start { border:1px solid rgba(217,210,191,.35); padding:.85em 2.6em; letter-spacing:.5em; color:var(--bone); background:rgba(0,0,0,.4);
    transition:all .3s; cursor:pointer; font-size:15px; }
  #btn-start:hover { background:rgba(163,18,27,.25); border-color:var(--red); letter-spacing:.62em; }
  #btn-start:disabled { opacity:.25; cursor:wait; }
  #load-device { pointer-events:none; }
  .is-mobile #hud .bl { bottom:auto; top:calc(max(14px,env(safe-area-inset-top)) + 84px); font-size:13px; }
  .is-mobile .meter { width:110px; }
  @media (max-height: 520px) {
    #loader .title { font-size:clamp(44px,11vh,96px); }
    #loader .mt-10 { margin-top:.6rem; } #loader .mt-12 { margin-top:1rem; } #loader .mt-8 { margin-top:.6rem; }
    #load-help { font-size:13px; line-height:1.35; } #load-device { bottom:.3rem; font-size:11px; }
    .drip { display:none; }
  }
  .pulse-soft { animation:pulseSoft 2.4s infinite; }
  @keyframes pulseSoft { 0%,100%{opacity:.45} 50%{opacity:1} }

  /* ---------- HUD ---------- */
  #hud { z-index:10; pointer-events:none; }
  #hud .tl { position:absolute; top:max(14px,env(safe-area-inset-top)); left:max(18px,env(safe-area-inset-left)); }
  #hud .tr { position:absolute; top:max(14px,env(safe-area-inset-top)); right:max(18px,env(safe-area-inset-right)); text-align:right; }
  #hud .bl { position:absolute; bottom:max(16px,env(safe-area-inset-bottom)); left:max(18px,env(safe-area-inset-left)); }
  .rec-dot { display:inline-block; width:.62em; height:.62em; border-radius:50%; background:#e0101c; margin-right:.35em; animation:recBlink 1.2s steps(1) infinite; box-shadow:0 0 8px #f00; }
  @keyframes recBlink { 50%{opacity:0} }
  #msg { position:absolute; left:50%; bottom:22%; transform:translateX(-50%); width:min(680px,88vw); text-align:center; font-size:clamp(15px,2.2vw,21px);
    line-height:1.5; opacity:0; transition:opacity 1.2s; color:#d8cfb8; text-shadow:0 0 12px #000, 0 0 3px #000; }
  #crosshair { position:absolute; left:50%; top:50%; width:3px; height:3px; margin:-1.5px 0 0 -1.5px; border-radius:50%; background:rgba(217,210,191,.35); }
  .meter { width:150px; height:3px; background:rgba(255,255,255,.08); margin-top:5px; overflow:hidden; }
  .meter > div { height:100%; transition:width .25s linear; }

  /* ---------- touch ---------- */
  #touch { z-index:20; touch-action:none; }
  .stick-base { position:absolute; width:124px; height:124px; margin:-62px 0 0 -62px; border-radius:50%; border:1px solid rgba(217,210,191,.22);
    background:radial-gradient(circle, rgba(0,0,0,.05), rgba(0,0,0,.35)); pointer-events:none; opacity:.35; transition:opacity .2s; }
  .stick-base.active { opacity:.9; }
  .stick-knob { position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(217,210,191,.35), rgba(80,10,12,.45)); border:1px solid rgba(217,210,191,.35); }
  .tbtn { position:absolute; width:60px; height:60px; border-radius:50%; border:1px solid rgba(217,210,191,.3); background:rgba(10,8,8,.45);
    color:var(--bone); font-family:'VT323',monospace; font-size:16px; letter-spacing:.06em; display:flex; align-items:center; justify-content:center; touch-action:none; }
  .tbtn.on { background:rgba(163,18,27,.4); border-color:rgba(255,80,80,.6); }

  /* ---------- overlays ---------- */
  .overlay { z-index:30; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; background:rgba(0,0,0,.82); }
  .ov-btn { margin-top:2.2em; border:1px solid rgba(217,210,191,.35); padding:.8em 2.4em; letter-spacing:.42em; cursor:pointer; background:transparent; color:var(--bone); }
  .ov-btn:hover { border-color:var(--red); background:rgba(163,18,27,.2); }
  #fade { z-index:28; background:#000; opacity:0; pointer-events:none; transition:opacity 1.4s; }
  #rotate-hint { z-index:25; pointer-events:none; }
</style>
</head>
<body>
<div id="app"></div>

<!-- HUD -->
<div id="hud" class="layer hidden-x f-vt vhs">
  <div class="tl text-[22px] leading-tight">
    <div><span class="rec-dot"></span>REC</div>
    <div id="hud-time" class="text-[18px] opacity-80">03:14:00 AM</div>
    <div class="text-[16px] opacity-60">OCT.28 1996</div>
  </div>
  <div class="tr text-[22px] leading-tight">
    <div>PLAY &#9654; SP</div>
    <div id="hud-bpm" class="text-[18px] opacity-80">&hearts; 64 BPM</div>
    <div id="hud-obj" class="text-[16px] opacity-70">MEMORIES 0/4</div>
  </div>
  <div class="bl text-[15px] opacity-75">
    <div>SANITY</div><div class="meter"><div id="hud-sanity" style="width:100%;background:#cfc6b0"></div></div>
    <div class="mt-2">BREATH</div><div class="meter"><div id="hud-stamina" style="width:100%;background:#6f8a86"></div></div>
  </div>
  <div id="crosshair"></div>
  <div id="msg" class="f-elite"></div>
</div>

<!-- Touch controls -->
<div id="touch" class="layer hidden-x">
  <div id="stick-move" class="stick-base"><div class="stick-knob"></div></div>
  <div id="tb-light" class="tbtn on" style="right:calc(max(18px,env(safe-area-inset-right)) + 76px); bottom:calc(max(18px,env(safe-area-inset-bottom)) + 150px);">LIGHT</div>
  <div id="tb-run" class="tbtn" style="right:calc(max(18px,env(safe-area-inset-right)) + 6px); bottom:calc(max(18px,env(safe-area-inset-bottom)) + 182px);">RUN</div>
  <div id="tb-gyro" class="tbtn" style="left:50%; margin-left:-84px; top:max(10px,env(safe-area-inset-top)); width:48px; height:48px; font-size:13px;">GYRO</div>
  <div id="tb-pause" class="tbtn" style="left:50%; margin-left:-24px; top:max(10px,env(safe-area-inset-top)); width:48px; height:48px; font-size:18px;">II</div>
</div>
<div id="rotate-hint" class="layer hidden-x flex items-start justify-center pt-24 f-vt text-[18px] opacity-70 vhs">ROTATE DEVICE FOR A WIDER VIEW</div>

<div id="fade" class="layer"></div>

<!-- Pause -->
<div id="pause" class="layer overlay hidden-x">
  <div class="f-vt vhs text-[44px] tracking-[.3em]">&#10074;&#10074; PAUSE</div>
  <div class="f-elite mt-4 opacity-70 text-[15px] px-6">It is still there. It does not pause.</div>
  <button id="btn-resume" class="ov-btn f-vt text-[20px]">RESUME</button>
  <div id="pause-hint" class="f-vt mt-6 opacity-50 text-[16px]"></div>
</div>

<!-- Death -->
<div id="death" class="layer overlay hidden-x" style="background:rgba(0,0,0,.92)">
  <div id="death-title" class="title" style="font-size:clamp(34px,8vw,84px); letter-spacing:.18em; padding-left:.18em">SUNK</div>
  <div id="death-sub" class="f-elite mt-6 opacity-80 text-[17px] px-6 max-w-[640px]"></div>
  <div id="death-stats" class="f-vt mt-6 opacity-60 text-[18px]"></div>
  <button id="btn-retry" class="ov-btn f-vt text-[20px]">DESCEND AGAIN</button>
</div>

<!-- Win -->
<div id="win" class="layer overlay hidden-x" style="background:#000">
  <div class="title" style="font-size:clamp(34px,8vw,84px); letter-spacing:.18em; padding-left:.18em">DRAINED</div>
  <div id="win-sub" class="f-elite mt-6 opacity-80 text-[17px] px-6 max-w-[640px]"></div>
  <div id="win-stats" class="f-vt mt-6 opacity-60 text-[18px]"></div>
  <button id="btn-again" class="ov-btn f-vt text-[20px]">GO DOWN AGAIN</button>
</div>

<!-- Loader -->
<div id="loader" class="layer">
  <div class="relative select-none">
    <div class="title f-elite">SINK</div>
    <div class="drip" style="left:24%; animation-delay:.3s"></div>
    <div class="drip" style="left:51%; animation-delay:2.1s; width:4px"></div>
    <div class="drip" style="left:77%; animation-delay:3.6s"></div>
  </div>
  <div class="f-elite mt-10 text-[13px] tracking-[.4em] opacity-60 text-center px-6">THE WATER IS STILL RUNNING</div>
  <div class="mt-12 bar-wrap"><div id="load-bar"></div></div>
  <div class="mt-3 flex justify-between f-vt text-[17px] opacity-75" style="width:min(420px,78vw)">
    <span id="load-status">INITIALIZING</span><span id="load-pct">0%</span>
  </div>
  <button id="btn-start" class="mt-12 f-vt hidden-x" disabled>DESCEND</button>
  <div id="load-help" class="f-vt mt-8 text-[16px] opacity-55 text-center leading-relaxed px-6"></div>
  <div id="load-device" class="f-vt absolute bottom-4 left-0 right-0 text-center text-[14px] opacity-35 px-4"></div>
</div>

<script>
/* SINK — procedural key art. drawIcon(ctx, S, {maskable, simple}) and drawPoster(ctx, W, H, {orient}). */
(function (global) {
  'use strict';
  const TAU = Math.PI * 2;
  function rng(seed) { let a = seed | 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  /** The face looking up out of the drain. (cx,cy) centre, R = drain radius. */
  function drawDrainFace(g, cx, cy, R, r, detail) {
    g.save();
    g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.clip();
    // abyss
    let gr = g.createRadialGradient(cx, cy, R * 0.1, cx, cy, R);
    gr.addColorStop(0, '#0a0c0c'); gr.addColorStop(1, '#000'); g.fillStyle = gr; g.fillRect(cx - R, cy - R, 2 * R, 2 * R);
    // face: long pale oval, tilted, lower part sinking into the dark
    g.save(); g.translate(cx + R * 0.02, cy - R * 0.06); g.rotate(-0.34);
    const fw = R * 0.72, fh = R * 1.12;
    gr = g.createRadialGradient(-fw * 0.15, -fh * 0.35, fw * 0.1, 0, 0, fh * 1.05);
    gr.addColorStop(0, '#d9d0bd'); gr.addColorStop(0.45, '#a69c89'); gr.addColorStop(0.8, '#3f3a33'); gr.addColorStop(1, '#0b0a09');
    g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, fw, fh, 0, 0, TAU); g.fill();
    // sockets: deep, mismatched
    const eyes = [[-fw * 0.36, -fh * 0.2, fw * 0.23, fh * 0.13], [fw * 0.35, -fh * 0.12, fw * 0.18, fh * 0.105]];
    for (const [ex, ey, ew, eh] of eyes) {
      gr = g.createRadialGradient(ex, ey, 0, ex, ey, ew * 1.6);
      gr.addColorStop(0, 'rgba(20,6,6,0.95)'); gr.addColorStop(0.55, 'rgba(60,20,22,0.6)'); gr.addColorStop(1, 'rgba(60,30,30,0)');
      g.fillStyle = gr; g.beginPath(); g.ellipse(ex, ey, ew * 1.6, eh * 1.7, 0, 0, TAU); g.fill();
    }
    // nose shadow
    g.fillStyle = 'rgba(30,22,18,0.55)'; g.beginPath(); g.moveTo(-fw * 0.02, -fh * 0.1); g.quadraticCurveTo(fw * 0.12, fh * 0.12, -fw * 0.04, fh * 0.2); g.quadraticCurveTo(-fw * 0.12, fh * 0.14, -fw * 0.02, -fh * 0.1); g.fill();
    g.fillStyle = 'rgba(10,6,6,0.8)'; g.beginPath(); g.ellipse(-fw * 0.1, fh * 0.2, fw * 0.05, fh * 0.025, 0, 0, TAU); g.ellipse(fw * 0.07, fh * 0.21, fw * 0.045, fh * 0.022, 0, 0, TAU); g.fill();
    // eyes: lidless, too round, pinprick pupils, both locked on the viewer
    for (const [ex, ey, ew, eh] of eyes) {
      gr = g.createRadialGradient(ex - ew * 0.25, ey - eh * 0.3, 0, ex, ey, ew);
      gr.addColorStop(0, '#e6dfcd'); gr.addColorStop(0.7, '#b3a993'); gr.addColorStop(1, '#5a5148');
      g.fillStyle = gr; g.beginPath(); g.ellipse(ex, ey, ew * 0.82, eh * 0.9, 0, 0, TAU); g.fill();
      if (detail) { g.strokeStyle = 'rgba(150,20,25,0.55)'; g.lineWidth = Math.max(0.6, ew * 0.035); const rr = rng(Math.round(ex * 100));
        for (let k = 0; k < 7; k++) { const a = rr() * TAU; g.beginPath(); g.moveTo(ex + Math.cos(a) * ew * 0.8, ey + Math.sin(a) * eh * 0.85); g.quadraticCurveTo(ex + Math.cos(a + 0.3) * ew * 0.55, ey + Math.sin(a + 0.3) * eh * 0.6, ex + Math.cos(a) * ew * 0.4, ey + Math.sin(a) * eh * 0.42); g.stroke(); } }
      g.fillStyle = '#2c3127'; g.beginPath(); g.arc(ex + ew * 0.1, ey + eh * 0.12, ew * 0.24, 0, TAU); g.fill();
      g.fillStyle = 'rgba(170,190,130,0.3)'; g.beginPath(); g.arc(ex + ew * 0.1, ey + eh * 0.12, ew * 0.24, 0, TAU); g.fill();
      g.fillStyle = '#000'; g.beginPath(); g.arc(ex + ew * 0.1, ey + eh * 0.12, ew * 0.055, 0, TAU); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.9)'; g.beginPath(); g.arc(ex - ew * 0.2, ey - eh * 0.28, ew * 0.08, 0, TAU); g.fill();
    }
    // grin: ear to ear, corners lifted, crowded small teeth
    const my = fh * 0.33, mw = fw * 1.08;
    const lipTop = (t) => my + Math.pow(Math.abs(t), 2.2) * -fh * 0.24, lipBot = (t) => my + fh * 0.13 * (1 - t * t) + Math.pow(Math.abs(t), 2.2) * -fh * 0.24;
    g.beginPath(); for (let i = 0; i <= 40; i++) { const t = i / 20 - 1; g.lineTo(t * mw, lipTop(t)); } for (let i = 40; i >= 0; i--) { const t = i / 20 - 1; g.lineTo(t * mw, lipBot(t)); } g.closePath();
    g.fillStyle = '#1a0405'; g.fill(); g.save(); g.clip();
    g.fillStyle = '#4a0b0e'; g.beginPath(); g.ellipse(0, my + fh * 0.07, mw * 0.6, fh * 0.05, 0, 0, TAU); g.fill();
    const nT = detail ? 22 : 14;
    for (let i = 0; i < nT; i++) { const t = (i + 0.5) / nT * 2 - 1, x = t * mw, w = mw * 2 / nT * 0.84, h = fh * (0.062 + (Math.abs(t) < 0.2 ? 0.012 : 0)) * (1 - Math.abs(t) * 0.3);
      gr = g.createLinearGradient(0, lipTop(t), 0, lipTop(t) + h); gr.addColorStop(0, '#e8e0cc'); gr.addColorStop(1, '#8f8670'); g.fillStyle = gr;
      g.fillRect(x - w / 2, lipTop(t) - 1, w, h); if (i !== 9) { g.fillRect(x - w / 2, lipBot(t) - h * 0.85, w, h * 0.85); } }
    g.restore();
    g.strokeStyle = 'rgba(70,10,12,0.9)'; g.lineWidth = Math.max(1, fw * 0.02);
    g.beginPath(); for (let i = 0; i <= 40; i++) { const t = i / 20 - 1; g.lineTo(t * mw, lipTop(t)); } g.stroke();
    // smile folds
    g.strokeStyle = 'rgba(25,18,15,0.45)'; g.lineWidth = Math.max(1, fw * 0.025);
    for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(sx * fw * 0.22, fh * 0.16); g.quadraticCurveTo(sx * fw * 0.62, fh * 0.26, sx * mw * 1.02, lipTop(sx) - fh * 0.02); g.stroke(); }
    g.restore();
    // wet hair strands falling across from the top of the drain
    const rh = rng(77);
    g.lineCap = 'round';
    for (let k = 0; k < (detail ? 14 : 7); k++) {
      const side = k % 2 ? 1 : -1, x0 = cx + side * R * (0.55 + rh() * 0.45), w = R * (0.04 + rh() * 0.06);
      g.strokeStyle = `rgba(${4 + rh() * 8},${3 + rh() * 6},${3 + rh() * 6},${0.75 + rh() * 0.25})`; g.lineWidth = w;
      g.beginPath(); g.moveTo(x0, cy - R * 1.05); g.bezierCurveTo(x0 + (rh() - 0.5) * R * 0.5, cy - R * 0.3, x0 + (rh() - 0.5) * R * 0.6, cy + R * 0.3, x0 + (rh() - 0.5) * R * 0.8, cy + R * 1.05); g.stroke();
      if (detail && rh() < 0.5) { g.strokeStyle = 'rgba(160,170,165,0.12)'; g.lineWidth = w * 0.25; g.stroke(); }
    }
    // inner wall shadow of the pipe
    gr = g.createRadialGradient(cx, cy, R * 0.55, cx, cy, R); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.85)');
    g.fillStyle = gr; g.fillRect(cx - R, cy - R, 2 * R, 2 * R);
    g.restore();
  }

  function finger(g, pts, w, rr) {
    // pts: array of joints from base (in the drain) to tip
    const n = pts.length;
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < n - 1; i++) {
        const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], t0 = i / (n - 1), t1 = (i + 1) / (n - 1);

  '#.#.#.###.###.#.###.#.#',

  '#.#.###.#.#####.#.#.#.#',
  '#...#...s...M.....#...#',
  '#.#.#.#######.###.#####',
  '#.#...#.....#...#.....#',
  '#.#####.###.###.#.###.#',
  '#......L..#.....S.#K.E#',

{

    document.addEventListener('visibilitychange', () => { if (document.hidden) { if (this.state === 'playing') this.pause(); this.audio.suspend(); } });
  }
  warmup() {
    this.player.update(0.016, this.input, this.ctxLite());
    this.renderer.compile(this.scene, this.camera);
    { const f = new THREE.Vector3(); this.camera.getWorldDirection(f); this.rig.root.position.set(this.player.pos.x + f.x * 2, 0, this.player.pos.z + f.z * 2); this.rig.root.updateMatrixWorld(true); }
    this.post.render(this.scene, this.camera);
    this.ai.syncRig();
  }
  ctxLite() { return this; }
  get dying() { return this.state === 'dying'; }

  begin() {
    GAME_STARTED = true;
    show(UI.loader, false); show(UI.hud, true); if (this.dev.mobile) show(UI.touch, true);
    this.audio.resume().then(() => { this.audio.start(this.world); this.audio.fadeMaster(0.9, 1.2); }).catch(() => {});
    if (!this.dev.mobile) this.input.requestLock();
    else {
      this.input.enableGyro(); // first: iOS motion permission needs the untouched tap gesture
      const el = document.documentElement; const rf = el.requestFullscreen || el.webkitRequestFullscreen;
      if (rf) { try { const p = rf.call(el); if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {}); } catch (e) {} }
    }
    this.state = 'playing'; this.fadeTarget = 0; this.onResize();
    this.hud.message('Find what you lost.<br><span style="opacity:.6">Do not look at it for too long.</span>', 6);
  }
  restart() {
    show(UI.death, false); show(UI.win, false); show(UI.pause, false);
    this.world.reset(); this.player.reset(); this.ai.reset(); this.fear.reset();
    this.memories = 0; this.finalChaseT = 0; this.qLevel = this.qLevel || 0; this.time = 0; this.glitch = 0; this.flash = 0; this.shake = 0; this.damage = 0; this.fadeV = 1; this.stats = { gaslights: 0, hunts: 0 };
    UI.tbLight.classList.add('on'); show(UI.hud, true); if (this.dev.mobile) show(UI.touch, true);
    this.audio.resume(); this.audio.fadeMaster(0.9, 1);
    if (!this.dev.mobile) this.input.requestLock();
    this.input.resetLook(); this.state = 'playing'; this.fadeTarget = 0;
    this.hud.message('The water is still running.', 4);
  }
  pause() {
    if (this.state !== 'playing') return; this.state = 'paused'; show(UI.pause, true); this.audio.fadeMaster(0.0, 0.2);
    setTimeout(() => { if (this.state === 'paused') this.audio.suspend(); }, 400);
  }
  resume() {
    if (this.state !== 'paused') return; show(UI.pause, false); this.audio.resume(); this.audio.fadeMaster(0.9, 0.4);
    if (!this.dev.mobile) this.input.requestLock(); this.input.resetLook(); this.state = 'playing'; this.last = performance.now();
  }
  togglePause() { if (this.state === 'playing') this.pause(); else if (this.state === 'paused') this.resume(); }
  toggleLight() {
    if (this.state !== 'playing') return; const L = this.player.light; L.on = !L.on; UI.tbLight.classList.toggle('on', L.on);
    if (this.audio.ok) this.audio.switchClick();
  }
  caught() {
    if (this.state !== 'playing') return;
    this.state = 'dying'; this.deathT = 0; this.deathKind = 'caught'; if (this.audio.ok) this.audio.scream(); this.flash = 0.6; this.glitch = 1.5;
    this.ai.setState('GASLIGHT'); this.ai.gas.phase = 3; this.ai.visible = true; this.rig.root.visible = true;
    if (document.pointerLockElement) document.exitPointerLock();
  }
  sanityBreak() {
    if (this.state !== 'playing') return;
    this.state = 'dying'; this.deathT = 0; this.deathKind = 'sanity'; if (this.audio.ok) { this.audio.subHit(1); this.audio.stinger(0.8); } this.glitch = 1.2;
    if (document.pointerLockElement) document.exitPointerLock();
  }
  showDeath() {
    this.state = 'dead'; show(UI.hud, false); show(UI.touch, false); show(UI.death, true);
    const caught = this.deathKind === 'caught';
    UI.deathTitle.textContent = caught ? 'SUNK' : 'DROWNED';
    UI.deathSub.innerHTML = caught ? 'It was always behind you.<br>It was always so much closer than the light.' : 'You forgot which way was up.<br>The water was kind about it.';
    UI.deathStats.textContent = `MEMORIES ${this.memories}/4  ·  TIME ${this.fmt(this.time)}  ·  SANITY ${Math.round(this.fear.sanity * 100)}%`;
    this.audio.fadeMaster(0.25, 2);
  }
  win() {
    if (this.state !== 'playing') return; this.state = 'escaping'; this.escT = 0; this.fadeTarget = 1; if (this.audio.ok) this.audio.subHit(0.7);
    if (document.pointerLockElement) document.exitPointerLock();
  }
  showWin() {
    this.state = 'won'; show(UI.hud, false); show(UI.touch, false); show(UI.win, true);
    UI.winSub.innerHTML = 'You went down.<br>At the bottom the tap was finally off,<br>and someone had left the light on for you.';
    UI.winStats.textContent = `TIME ${this.fmt(this.time)}  ·  SANITY ${Math.round(this.fear.sanity * 100)}%  ·  IT HUNTED YOU ${this.stats.hunts}×`;
    this.audio.fadeMaster(0.0, 3);
  }
  fmt(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${m}:${String(s).padStart(2, '0')}`; }

  /* ---------- per-frame ---------- */
  step(dt) {
    const P = this.player, A = this.ai, W = this.world, F = this.fear;
    if (this.state === 'playing' || this.state === 'escaping') {
      this.time += dt; this.input.update(dt); P.update(dt, this.input, this);
      const cam = this.camera, fwd3 = this.fwd3 || (this.fwd3 = new THREE.Vector3()); cam.getWorldDirection(fwd3);
      const fwd = this.fwd2 || (this.fwd2 = new THREE.Vector3()); fwd.set(fwd3.x, 0, fwd3.z).normalize();
      const playerCell = W.cellOf(P.pos), spin = P.yawSpeed > 4.2 && !this.wasSpinning; this.wasSpinning = P.yawSpeed > 3.2;
      const nearLight = W.bulbs.some((b) => b.current > 0.45 && Math.hypot(b.pos.x - P.pos.x, b.pos.z - P.pos.z) < 3.4 && W.los(P.pos.x, P.pos.z, b.pos.x, b.pos.z));
      const sense = { cam: cam.position, fwd, fwd3, light: P.light, lightOn: P.light.on, playerCell, memories: this.memories, panic: F.panic, sprinting: P.sprinting,
        spin, time: this.time, nearLight };
      if (this.state === 'playing') {
        A.update(dt, sense);
      }
      if (this.state !== 'playing' && this.state !== 'escaping') return; // caught during AI update
      const dark = P.light.eff < 0.2 && !nearLight;
      F.update(dt, { yawSpeed: P.yawSpeed, moveFlip: P.moveFlip, stare: A.stare, monsterDist: A.dist, monsterVisible: A.visible, hunting: A.state === 'HUNT', dark });
      const S = { time: this.time, panic: F.panic, camera: cam, fwd, playerCell, monsterCell: A.cell(), monsterNear: (p, r) => A.visible && Math.hypot(A.pos.x - p.x, A.pos.z - p.z) < r };
      W.update(dt, S, this.audio);
      this.checkPickups(); this.checkDoor(dt);
      if (this.finalChaseT > 0 && this.state === 'playing') { this.finalChaseT -= dt; if (this.finalChaseT <= 0) { this.hud.message('Somewhere, a door has opened.<br><b style="color:#d23">IT KNOWS. RUN.</b>', 5); this.ai.startFinalChase(this.lastSense()); } }
      if (F.sanity <= 0 && this.state === 'playing') this.sanityBreak();
      this.bpm = 62 + F.panic * 95 + (P.sprinting ? 14 : 0) + (1 - P.stamina) * 10;
      this.damage = damp(this.damage, A.visible ? smooth(6, 1.2, A.dist) * (A.state === 'HUNT' ? 1 : 0.5) : 0, 4, dt);
      this.audio.update(dt, { camera: cam, panic: F.panic, sanity: F.sanity, exertion: (1 - P.stamina) * (P.sprinting ? 1 : 0.6), bpm: this.bpm, glitch: this.glitch,
        monsterPos: A.pos, monsterState: A.state, monsterVisible: A.visible, monsterLit: A.litAmt, monsterSpeed: A.speed, monsterDist: A.dist, dying: false });
      this.hud.update(dt, this);
      if (this.state === 'escaping') { this.escT += dt; if (this.escT > 2.2) this.showWin(); }
    } else if (this.state === 'dying') {
      this.stepDeath(dt);
    }
  }
  stepDeath(dt) {
    this.deathT += dt; const P = this.player, A = this.ai, cam = this.camera;
    if (this.deathKind === 'caught') {
      const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw); A.pos.set(P.pos.x + fx * 0.85, 0, P.pos.z + fz * 0.85); A.heading = Math.atan2(-fx, -fz);
      A.syncRig(); this.rig.root.position.y = -0.45 + Math.min(this.deathT * 2, 0.3);
      this.rig.animate(dt, { t: this.time + this.deathT, speed: 0, lit: 1, agit: 1.5, jaw: 1.2, lookYaw: 0, lookPitch: -0.3, peek: 0, rage: 1, eyeBoost: 1.2, crouch: 0, lean: 1, stretch: 0.4 });
      this.rig.postUpdate(cam.position, dt, this.time + this.deathT);
      this.rig.root.updateMatrixWorld(true); const hp = new THREE.Vector3(); this.rig.J.head.getWorldPosition(hp);
      const m = new THREE.Matrix4().lookAt(cam.position, hp, new THREE.Vector3(0, 1, 0)); const q = new THREE.Quaternion().setFromRotationMatrix(m);
      cam.quaternion.slerp(q, 1 - Math.exp(-14 * dt)); cam.position.y = EYE + (Math.random() - 0.5) * 0.04;
      P.light.eff = 0.7 + Math.random() * 0.6; P.spot.intensity = 3.4 * P.light.eff;
      P.holder.position.copy(cam.position); P.holder.quaternion.copy(cam.quaternion); P.holder.updateMatrixWorld(true);
      this.shake = 1; this.damage = 1; this.fear.panic = 1;
      if (this.deathT > 1.5) this.fadeTarget = 1;
      if (this.deathT > 2.4) this.showDeath();
    } else {
      cam.rotation.z += dt * 0.6; cam.position.y = Math.max(0.3, cam.position.y - dt * 0.6); this.fear.panic = 1;
      P.light.eff = Math.random() < 0.3 ? 0 : 0.4; P.spot.intensity = 3.4 * P.light.eff;
      if (this.deathT > 1.6) this.fadeTarget = 1; if (this.deathT > 3) this.showDeath();
    }
    this.audio.update(dt, { camera: cam, panic: 1, sanity: this.fear.sanity, exertion: 1, bpm: 170, glitch: this.glitch, monsterPos: this.ai.pos, monsterState: 'HUNT',
      monsterVisible: this.deathKind === 'caught', monsterLit: 1, monsterSpeed: 0, monsterDist: 1, dying: true });
  }
  checkPickups() {
    const P = this.player.pos;
    for (const s of this.world.sinks) {
      if (s.collected) continue;
      if (Math.hypot(s.pos.x - P.x, s.pos.z - P.z) < 1.35) {
        s.collected = true; s.photo.visible = false; this.memories++;
        this.fear.sanity = clamp(this.fear.sanity + 0.15, 0, 1); this.fear.spike(0.1); this.ai.pressure += 0.25;
        if (this.audio.ok) this.audio.chime(); this.glitch = Math.max(this.glitch, 0.35);
        const d = MEMORY_DATA[s.index];
        this.hud.message(`<span style="opacity:.55;font-size:.8em;letter-spacing:.3em">MEMORY ${this.memories}/4 — "${d.caption}"</span><br>${d.lore}`, 7);
        if (this.memories >= 4) {
          this.world.door.target = 1; if (this.audio.ok) this.audio.creak(this.world.door.pos, 1);
          this.finalChaseT = 6.5;
        }
      }
    }
  }
  lastSense() {
    const cam = this.camera, f = new THREE.Vector3(); cam.getWorldDirection(f); f.y = 0; f.normalize();
    return { cam: cam.position, fwd: f, playerCell: this.world.cellOf(this.player.pos) };
  }
  checkDoor(dt) {
    const D = this.world.door, P = this.player.pos, d = Math.hypot(D.pos.x - P.x, D.pos.z - P.z);
    if (this.memories < 4) { if (d < 1.7) { this.lockedT = (this.lockedT || 0) - dt; if (this.lockedT <= 0) { this.hud.message('It won’t open.<br><span style="opacity:.6">Something is still missing.</span>', 3); this.lockedT = 5; } } }
    else if (D.open > 0.7 && d < 1.0 && this.state === 'playing') this.win();
  }
  applyDistortions(dt) {
    const F = this.fear, U = this.post.U, P = this.player;
    this.glitch = Math.max(0, this.glitch - dt * 1.6); this.flash = Math.max(0, this.flash - dt * 2.5); this.shake = Math.max(0, this.shake - dt * 2);
    if (F.panic > 0.85 && Math.random() < dt * 0.8) this.glitch = Math.max(this.glitch, rand(0.2, 0.6));
    this.fadeV = damp(this.fadeV, this.fadeTarget ?? 1, this.state === 'playing' ? 1.8 : 2.4, dt);
    U.uTime.value = this.time + performance.now() * 0.0001; U.uPanic.value = damp(U.uPanic.value, F.panic, 5, dt); U.uGlitch.value = this.glitch;
    U.uFlash.value = this.flash; U.uDamage.value = this.damage * 0.8 + smooth(0.75, 1, F.panic) * 0.25 * (0.5 + 0.5 * Math.sin(this.time * this.bpm / 60 * TAU));
    U.uSanity.value = F.sanity; U.uFade.value = this.fadeV;
    WARP_U.uWarp.value = damp(WARP_U.uWarp.value, smooth(0.3, 1, F.panic) * (1.25 - F.sanity * 0.45), 1.5, dt);
    WARP_U.uTime.value = this.time; WARP_U.uCamPos.value.copy(this.camera.position); this.camera.getWorldDirection(WARP_U.uCamDir.value);
    const targetFov = this.baseFov - F.panic * 7 - (this.ai.stare > 0.5 ? 4 * this.ai.stare : 0);
    if (Math.abs(this.camera.fov - targetFov) > 0.05) { this.camera.fov = damp(this.camera.fov, targetFov, 3, dt); this.camera.updateProjectionMatrix(); }
    const D = this.dust.U; D.uTime.value = this.time; D.uCam.value.copy(this.camera.position); D.uLPos.value.setFromMatrixPosition(P.holder.matrixWorld);
    D.uLDir.value.set(0, 0, -1).applyQuaternion(P.holder.quaternion); D.uCos.value = Math.cos(P.light.angle); D.uOn.value = P.light.eff;
  }
  /** Dynamic resolution + quality ladder driven by real (unclamped) frame time. */
  adaptPerf(rawDt) {
    const ms = Math.min(rawDt * 1000, 250);
    this.frameAvg = lerp(this.frameAvg, ms, 0.08); this.perfT += rawDt;
    if (this.perfT < 1.5) return; this.perfT = 0;
    const target = 1000 / 60;
    if (this.frameAvg > target * 1.18) {
      if (this.renderScale > this.Q.minScale) { this.renderScale = Math.max(this.Q.minScale, this.renderScale - (this.frameAvg > target * 2 ? 0.15 : 0.08)); this.onResize(); }
      else this.degradeQuality();
    } else if (this.frameAvg < target * 0.9 && this.renderScale < this.Q.renderScale) { this.renderScale = Math.min(this.Q.renderScale, this.renderScale + 0.05); this.onResize(); }
  }
  degradeQuality() {
    this.qLevel = (this.qLevel || 0) + 1; const P = this.player;
    if (this.qLevel === 1) { P.spill.visible = false; P.spillDisabled = true; }
    else if (this.qLevel === 2) { const s = Math.max(256, P.spot.shadow.mapSize.x >> 1); P.spot.shadow.mapSize.set(s, s); if (P.spot.shadow.map) { P.spot.shadow.map.dispose(); P.spot.shadow.map = null; } }
    else if (this.qLevel === 3) { this.dust.visible = false; }
    else if (this.qLevel === 4) { this.renderer.shadowMap.type = THREE.BasicShadowMap; this.renderer.shadowMap.needsUpdate = true; this.scene.traverse((o) => { if (o.material) o.material.needsUpdate = true; }); }
  }
  loop() {
    this.last = performance.now();
    const tick = (now) => {
      requestAnimationFrame(tick);
      let dt = (now - this.last) / 1000; this.last = now; if (!(dt > 0)) dt = 0.016; const rawDt = dt; dt = Math.min(dt, 0.05);
      if (this.state === 'loading' || this.state === 'ready') { this.post.U.uFade.value = 1; return; }
      if (this.state === 'paused' || this.state === 'dead' || this.state === 'won') { this.post.render(this.scene, this.camera); return; }
      this.step(dt); this.applyDistortions(dt);
      if (this.state === 'playing') this.adaptPerf(rawDt);
      this.post.render(this.scene, this.camera);
    };
    requestAnimationFrame(tick);
  }
}

/* =====================================================================
   16b. HOME-SCREEN INSTALL — use the hosted manifest.webmanifest when it exists next to the page;
        otherwise paint the icons procedurally and install an in-memory manifest.
   ===================================================================== */
async function setupInstallManifest() {
  const link = document.getElementById('app-manifest');
  if (!link || location.protocol === 'file:') { if (link) link.remove(); return; }
  try { const r = await fetch(link.href, { method: 'GET', cache: 'no-store' }); if (r.ok) return; } catch (e) { /* not hosted with the kit */ }
  if (!window.SinkArt) return;
  const paint = (S, opt) => { const c = makeCanvas(S, S); SinkArt.drawIcon(c.getContext('2d'), S, opt); return c.toDataURL('image/png'); };
  const base = location.href.split('#')[0], scope = base.replace(/[^/]*$/, '');
  const manifest = {
    name: 'SINK', short_name: 'SINK', description: 'A first-person VHS horror game.',
    start_url: base, scope, display: 'fullscreen', orientation: 'landscape', background_color: '#000000', theme_color: '#000000',
    icons: [
      { src: paint(192, {}), sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: paint(512, {}), sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: paint(512, { maskable: true }), sizes: '512x512', type: 'image/png', purpose: 'maskable' }
    ]
  };
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
}

/* =====================================================================
   16. LOADING ORCHESTRATION
   ===================================================================== */
async function main() {
  const dev = detectDevice(); document.body.classList.toggle('is-mobile', dev.mobile);
  const Q = buildQuality(dev), AM = new AssetManager(), game = new Game(dev, Q), tex = {}; let audio;
  window.SINK_DEBUG = game;
  UI.help.innerHTML = dev.mobile
    ? 'LEFT SIDE — MOVE · DRAG RIGHT SIDE — LOOK<br>LIGHT — FLASHLIGHT · RUN — SPRINT · GYRO — AIM BY TURNING THE PHONE<br><span class="pulse-soft">HEADPHONES STRONGLY RECOMMENDED</span>'
    : 'WASD — MOVE · MOUSE — LOOK · SHIFT — RUN · F — FLASHLIGHT · ESC — PAUSE<br><span class="pulse-soft">HEADPHONES STRONGLY RECOMMENDED</span>';
  AM.add('Probing device', 1, async () => {
    game.initRenderer();
    UI.device.textContent = `${Q.tier} PROFILE · ${game.renderer.capabilities.isWebGL2 ? 'WEBGL2' : 'WEBGL1'} · SHADOWS ${Q.shadowSize} · ${Q.msaa ? 'MSAA ' + Q.msaa + 'X' : 'NO MSAA'} · DPR ${Q.pixelRatio.toFixed(2)} · SCORE ${dev.score}`;
  });
  AM.add('Typesetting fragments', 1, async () => {
    if (document.fonts && document.fonts.load) {
      await Promise.race([Promise.all([document.fonts.load('21px "Special Elite"'), document.fonts.load('20px "VT323"')]).catch(() => {}), new Promise((r) => setTimeout(r, 2500))]);
    }
  });
  AM.add('Staining wallpaper', 6, async (sub) => {
    const w = await genWall(Q.tex, (s) => sub(s * 0.9));
    tex.wall = await AM.texture('wall', w.color, { aniso: Q.aniso }); tex.wallBump = await AM.texture('wallBump', w.bump, { srgb: false, aniso: Q.aniso });
    tex.wallRough = await AM.texture('wallRough', w.rough, { srgb: false, aniso: Q.aniso });
  });
  AM.add('Rotting floorboards', 5, async (sub) => {
    const f = await genFloor(Q.tex, (s) => sub(s * 0.9));
    tex.floor = await AM.texture('floor', f.color, { aniso: Q.aniso }); tex.floorBump = await AM.texture('floorBump', f.bump, { srgb: false, aniso: Q.aniso });
    tex.floorRough = await AM.texture('floorRough', f.rough, { srgb: false, aniso: Q.aniso });
  });
  AM.add('Water-damaging the ceiling', 4, async (sub) => {
    const c = await genCeiling(Q.tex / 2, (s) => sub(s * 0.9));
    tex.ceil = await AM.texture('ceil', c.color, { aniso: Q.aniso }); tex.ceilBump = await AM.texture('ceilBump', c.bump, { srgb: false, aniso: Q.aniso });
  });
  AM.add('Weathering the door', 2, async (sub) => {
    const d = await genDoor(Q.tex / 2, (s) => sub(s * 0.8));
    tex.door = await AM.texture('door', d.color, { aniso: Q.aniso }); tex.doorBump = await AM.texture('doorBump', d.bump, { srgb: false, aniso: Q.aniso });
    tex.grime = await AM.texture('grime', genGrime(256), { aniso: Q.aniso }); tex.paper = await AM.texture('paper', genPaper(), { aniso: Q.aniso });
  });
  AM.add('Developing photographs', 2, async (sub) => {
    tex.photos = [];
    for (let i = 0; i < 4; i++) { const t = await AM.texture('photo' + i, genPhoto(i), { aniso: Q.aniso }); t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; tex.photos.push(t); sub((i + 1) / 4); }
  });
  AM.add('Building the house', 3, async () => { game.buildScene(tex); });
  AM.add('Carving the icon', 1, async () => { try { await setupInstallManifest(); } catch (e) { /* install is optional */ } });
  AM.add('Growing something in the walls', 2, async () => { /* rig built with scene; settle a first pose */ game.rig.animate(0.016, { t: 0, speed: 0, lit: 0, agit: 0.2, jaw: 0, lookYaw: 0, lookPitch: 0, peek: 0, rage: 0, crouch: 0 }); game.rig.postUpdate(null, 0.016, 0); });
  AM.add('Tuning the dark', 2, async () => {
    audio = new AudioEngine(dev.mobile); try { audio.init(); } catch (e) { audio.ok = false; }
    if (!audio.ok) UI.device.textContent += ' · AUDIO UNAVAILABLE';
    game.buildSystems(audio);
  });
  AM.add('Compiling shaders', 3, async () => { game.warmup(); await yieldFrame(); game.post.render(game.scene, game.camera); });
  const ok = await AM.run();
  if (!ok) return;
  game.state = 'ready'; game.loop();
  UI.status.textContent = 'READY'; show(UI.start, true); UI.start.disabled = false;
  UI.start.addEventListener('click', () => { if (game.state === 'ready') game.begin(); }, { once: true });
}
main().catch((e) => fatal('ERROR: ' + (e && e.message ? e.message : e)));
})();
</script>
